level: 37
title: "Secret Encoding vs Encryption"
objective: "Understand why base64 encoding is NOT security"
name: "Secret Encoding vs Encryption"
world: "Storage & Stateful Apps"
difficulty: "intermediate"
xp: 250
concepts:
  - secrets
