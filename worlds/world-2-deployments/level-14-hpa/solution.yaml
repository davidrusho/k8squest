# Level 14 has no manifest to fix: the HPA needs metrics-server, which is
# installed from upstream. Commands (same as SOLUTION.md, Option 2):
#
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#   kubectl patch -n kube-system deployment metrics-server --type=json -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
#
# Then wait for it to become ready and check the HPA:
#
#   kubectl wait --for=condition=ready pod -l k8s-app=metrics-server -n kube-system --timeout=60s
#   kubectl get hpa web-backend-hpa -n k8squest
