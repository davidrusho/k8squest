# The application whose loss you have to recover from. The cluster (two nodes, Flannel)
# is built by setup.sh with kubeadm.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-config
  namespace: k8squest
data:
  period: "2026-Q4"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: k8squest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      containers:
      - name: ledger
        image: registry.k8s.io/pause:3.10
        resources:
          requests:
            cpu: 10m
            memory: 8Mi
