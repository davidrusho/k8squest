level: 48
title: "Pod Security Standards: Restricted"
objective: "Fix the broken resources and make the validation pass"
name: "Pod Security Standards: Restricted"
difficulty: advanced
xp: 350
xp_reward: 350
world: 5
concepts:
  - pod-security-standards
  - pod-security-admission
  - restricted
  - securitycontext
description: |
  Your namespace enforces the "restricted" Pod Security Standard!
  
  Pods must meet strict security requirements, but the Pod template of the
  secure-app Deployment violates the restricted policy by running as root
  with privilege escalation enabled.
  
  The Deployment exists but has no Pods. Its ReplicaSet reports a FailedCreate
  event: 'violates PodSecurity "restricted:latest": ...'
  (see `kubectl describe rs -n k8squest` or `kubectl get events -n k8squest`).
  
  Your mission: Update the Pod template to meet restricted security standards.

learning_objectives:
  - Understand Pod Security Standards (privileged, baseline, restricted)
  - Configure pods to meet restricted requirements
  - Apply security best practices
  - Debug pod security admission failures (ReplicaSet FailedCreate events)
