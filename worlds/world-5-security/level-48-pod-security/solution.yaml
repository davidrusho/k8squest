# SOLUTION: Deployment whose Pod template meets the restricted Pod Security Standard

apiVersion: v1
kind: Namespace
metadata:
  name: k8squest
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-app
  namespace: k8squest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-app
  template:
    metadata:
      labels:
        app: secure-app
    spec:
      securityContext:  # ✅ Pod-level security
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:  # ✅ Required for restricted
          type: RuntimeDefault
      containers:
      - name: app
        image: nginx:latest
        securityContext:  # ✅ Container-level security
          runAsNonRoot: true  # ✅ Required
          runAsUser: 1000  # ✅ Non-root
          allowPrivilegeEscalation: false  # ✅ Required
          capabilities:  # ✅ Required
            drop:
            - ALL
        command: ["/bin/sh"]
        args:
        - -c
        - |
          echo "✅ Secure pod running with restricted security standards"
          echo "User: $(id -u), Group: $(id -g)"
          sleep 3600

# The Pod template now meets ALL restricted requirements:
# ✅ runAsNonRoot: true
# ✅ runAsUser: non-zero
# ✅ allowPrivilegeEscalation: false
# ✅ capabilities: drop ALL
# ✅ seccompProfile: RuntimeDefault
#
# The ReplicaSet creates the Pod and it runs securely!
