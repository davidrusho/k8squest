# SOLUTION: Adjusted resource requests to fit within quota

apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: k8squest
spec:
  hard:
    requests.cpu: "2"  # Total 2 CPUs
    requests.memory: "2Gi"  # Total 2Gi memory
    limits.cpu: "4"
    limits.memory: "4Gi"
    pods: "10"

---
# Fixed: Reduced resource requests in the Pod template to fit the quota
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-hungry-app
  namespace: k8squest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-hungry-app
  template:
    metadata:
      labels:
        app: resource-hungry-app
    spec:
      containers:
      - name: app
        image: nginx:latest
        resources:
          requests:
            cpu: "500m"  # ✅ Reduced to 0.5 CPUs (fits in 2 CPU quota)
            memory: "512Mi"  # ✅ Reduced to 512Mi (fits in 2Gi quota)
          limits:
            cpu: "1"  # ✅ Reduced limit (fits in 4 CPU quota)
            memory: "1Gi"  # ✅ Reduced limit (fits in 4Gi quota)

# The ReplicaSet can now create the Pod within the quota limits
# Requests: 500m CPU + 512Mi memory (well within 2 CPU / 2Gi quota)
