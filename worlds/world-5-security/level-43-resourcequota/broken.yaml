# BROKEN: ResourceQuota exceeded
# Problem: The Deployment's Pod template requests more CPU than the namespace quota allows
# Result: The Deployment is created, but its ReplicaSet cannot create the Pod (FailedCreate)

apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: k8squest
spec:
  hard:
    requests.cpu: "2"  # Total CPU requests limited to 2 cores
    requests.memory: "2Gi"  # Total memory requests limited to 2Gi
    limits.cpu: "4"  # Total CPU limits to 4 cores
    limits.memory: "4Gi"  # Total memory limits to 4Gi
    pods: "10"  # Maximum 10 pods

---
# This Deployment's Pod template requests too much!
# The Deployment object itself is admitted (quota counts Pods, not Deployments),
# but the ReplicaSet's attempt to create the Pod is rejected by the quota.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-hungry-app
  namespace: k8squest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-hungry-app
  template:
    metadata:
      labels:
        app: resource-hungry-app
    spec:
      containers:
      - name: app
        image: nginx:latest
        resources:
          requests:
            cpu: "2500m"  # ❌ Requests 2.5 CPUs but quota only allows 2 total!
            memory: "1Gi"
          limits:
            cpu: "3"
            memory: "2Gi"

# Result: No Pod exists. The ReplicaSet reports FailedCreate:
#   kubectl describe rs -n k8squest   (Events)
#   kubectl get events -n k8squest
# Error: "pods ... is forbidden: exceeded quota: compute-quota, requested: requests.cpu=2500m"
# Quota only has 2 CPUs available, the Pod wants 2.5 CPUs
