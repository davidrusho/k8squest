# The Certificate must reference the namespaced Issuer that exists.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: k8squest
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web-cert
  namespace: k8squest
spec:
  secretName: web-cert-tls
  dnsNames:
  - web.k8squest.example
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer   # ✅ matches the object in this namespace
