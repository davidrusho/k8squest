apiVersion: v1
kind: ServiceAccount
metadata:
  name: reports-sa
  namespace: k8squest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings
  namespace: k8squest
data:
  theme: dark
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-reader
  namespace: k8squest
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reports-binding
  namespace: k8squest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configmap-reader
subjects:
- kind: ServiceAccount
  name: reports-sa
  namespace: k8squest   # ✅ where reports-sa lives
---
apiVersion: v1
kind: Pod
metadata:
  name: reports-pod
  namespace: k8squest
spec:
  serviceAccountName: reports-sa
  containers:
  - name: client
    image: curlimages/curl:8.23.0
    command:
    - sh
    - -c
    - |
      SA=/var/run/secrets/kubernetes.io/serviceaccount
      while true; do
        code=$(curl -s -o /dev/null -w '%{http_code}' --cacert $SA/ca.crt \
          -H "Authorization: Bearer $(cat $SA/token)" \
          https://kubernetes.default.svc/api/v1/namespaces/$(cat $SA/namespace)/configmaps)
        echo "$(date +%T) GET configmaps -> HTTP $code"
        sleep 5
      done
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
