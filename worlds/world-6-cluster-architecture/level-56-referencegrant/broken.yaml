apiVersion: v1
kind: Namespace
metadata:
  name: k8squest-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: k8squest-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: k8squest-backend
spec:
  selector:
    app: catalog
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-routes
  namespace: k8squest-backend
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: default      # ❌ the route lives in k8squest, not default
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop-route
  namespace: k8squest
spec:
  parentRefs:
  - name: web-gw
  rules:
  - backendRefs:
    - name: catalog
      namespace: k8squest-backend
      port: 80
