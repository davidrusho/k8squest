# Fix the CRD (the schema declared replicas as a string), then create the resource:
#   kubectl apply -f solution.yaml        (fixed CRD)
#   kubectl apply -f "$HOME/.k8squest/work/level-53-crd-schema/website.yaml"   (the Website now validates)
# (your working copy of the CRD is crd.yaml in that directory)
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: websites.k8squest.io
  labels:
    app.kubernetes.io/part-of: k8squest
spec:
  group: k8squest.io
  scope: Namespaced
  names:
    plural: websites
    singular: website
    kind: Website
    shortNames:
    - ws
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: ["domain", "replicas"]
            properties:
              domain:
                type: string
              replicas:
                type: integer   # ✅ a count
                minimum: 1
                maximum: 10
              tier:
                type: string
                enum: ["free", "pro"]
