apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: websites.k8squest.io
  labels:
    app.kubernetes.io/part-of: k8squest
spec:
  group: k8squest.io
  scope: Namespaced
  names:
    plural: websites
    singular: website
    kind: Website
    shortNames:
    - ws
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: ["domain", "replicas"]
            properties:
              domain:
                type: string
              replicas:
                type: string   # ❌ replicas is a count, not a string
              tier:
                type: string
                enum: ["free", "pro"]
