# Level 68 has no manifest in this directory: metrics-server is installed from its release manifest.
# The fix is one container argument on the live Deployment.
#
#   kubectl top nodes                                    # error: Metrics API not available
#   kubectl get apiservice v1beta1.metrics.k8s.io        # Available=False (MissingEndpoints or FailedDiscoveryCheck)
#   kubectl get pods -n kube-system -l k8s-app=metrics-server      # 0/1 Running: never Ready
#   kubectl logs -n kube-system -l k8s-app=metrics-server
#     ... x509: cannot validate certificate for 172.18.0.x because it doesn't contain any IP SANs
#   kubectl edit deployment metrics-server -n kube-system
#     args:
#     - --kubelet-insecure-tls                           # ✅ kind's kubelet certificates are not signed by the cluster CA
