# Level 70 has no manifest fix. Both parts are commands.
#
# Part 1 - snapshot (flags come from the etcd static pod: kubectl -n kube-system get pod etcd-... -o yaml,
#          or /etc/kubernetes/manifests/etcd.yaml: --cert-file, --key-file, --trusted-ca-file, --listen-client-urls)
#   kubectl -n kube-system exec etcd-k8squest-multinode-control-plane -- etcdctl \
#     --endpoints=https://127.0.0.1:2379 \
#     --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt \
#     --key=/etc/kubernetes/pki/etcd/server.key snapshot save /var/lib/etcd/k8squest-snapshot.db
#   kubectl -n kube-system exec etcd-k8squest-multinode-control-plane -- \
#     etcdutl snapshot status /var/lib/etcd/k8squest-snapshot.db -w table
#
# Part 2 - take the lost node out of service
#   kubectl cordon k8squest-multinode-worker
#   kubectl drain k8squest-multinode-worker --ignore-daemonsets --delete-emptydir-data --force --timeout=30s
#     ... times out: the node's kubelet is down and cannot finish terminating the pods
#   kubectl get pods -n k8squest -o wide                 # replacements already Running on worker2; old ones Terminating
#   kubectl delete pod <stuck-pod> -n k8squest --force --grace-period=0     # remove a pod the dead node can never confirm
