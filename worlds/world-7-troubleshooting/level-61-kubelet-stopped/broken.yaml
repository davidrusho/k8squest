# The workload only. The fault (a stopped and disabled kubelet on the worker) is injected
# on the node by setup.sh, which applies this file after the node has gone NotReady.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: k8squest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8squest-multinode-worker   # pinned: the pods can only run on this node
      containers:
      - name: inventory
        image: registry.k8s.io/pause:3.10
        resources:
          requests:
            cpu: 10m
            memory: 8Mi
