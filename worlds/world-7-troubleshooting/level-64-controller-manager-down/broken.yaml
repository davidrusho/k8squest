# The workload only. The fault (a mistyped image tag in the kube-controller-manager static
# pod manifest) is injected on the control-plane node by setup.sh before this file is applied.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: k8squest
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
      - name: orders
        image: registry.k8s.io/pause:3.10
        resources:
          requests:
            cpu: 10m
            memory: 8Mi
