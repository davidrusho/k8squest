apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: k8squest
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: busybox
            command: ["/bin/sh", "-c", "date"]
