apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8squest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.21
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: k8squest
data:
  APP_ENV: prod
  APP_DEBUG: "false"
