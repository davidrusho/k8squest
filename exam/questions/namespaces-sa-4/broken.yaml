apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8squest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:1.21
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: k8squest
